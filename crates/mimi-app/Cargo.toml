[package]
name = "mimi-app"
description = "mimi: a minimalist, GPU-accelerated, agent-native terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mimi"
path = "src/main.rs"

[dependencies]
mimi-core.workspace = true
mimi-pty.workspace = true
mimi-agent.workspace = true
serde_json.workspace = true
libc.workspace = true
winit = "0.30"
wgpu = "24"
fontdue = "0.9"
arboard = { version = "3", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
